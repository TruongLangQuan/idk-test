[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c-plus2
framework = arduino

monitor_speed = 115200
upload_speed = 460800

lib_deps = 
    m5stack/M5StickCPlus2@^1.0.2

build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L