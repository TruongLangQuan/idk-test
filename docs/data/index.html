<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYD Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .info-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .info-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 24px;
            font-weight: bold;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-title {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #764ba2;
            color: white;
        }

        .btn-secondary:hover {
            background: #6a3f94;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        .status-box {
            background: #f5f7ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.8;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #666;
        }

        .status-label {
            font-weight: 600;
            color: #333;
        }

        .status-value {
            color: #667eea;
            font-weight: 500;
        }

        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            opacity: 0;
            transform: translateX(400px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }

            .header h1 {
                font-size: 24px;
            }

            .info-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 CYD Control Panel</h1>
            <p>ESP32-2432S028R Cheap Yellow Display</p>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <div class="info-label">Display</div>
                <div class="info-value">320×240</div>
            </div>
            <div class="info-card">
                <div class="info-label">Driver</div>
                <div class="info-value">ILI9341</div>
            </div>
            <div class="info-card">
                <div class="info-label">Uptime</div>
                <div class="info-value" id="uptime">--:--:--</div>
            </div>
            <div class="info-card">
                <div class="info-label">Current Screen</div>
                <div class="info-value" id="screen">1</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">🖼️ Screen Control</div>
            <div class="button-group">
                <button class="btn-primary" onclick="switchScreen(1)">Screen 1</button>
                <button class="btn-primary" onclick="switchScreen(2)">Screen 2</button>
                <button class="btn-secondary" onclick="switchScreen(3)">Screen 3</button>
                <button class="btn-secondary" onclick="nextScreen()">Next →</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">⚡ Device Information</div>
            <div class="status-box">
                <div class="status-item">
                    <span class="status-label">WiFi Mode:</span>
                    <span class="status-value">AP + STA</span>
                </div>
                <div class="status-item">
                    <span class="status-label">AP SSID:</span>
                    <span class="status-value">CYD_WiFi</span>
                </div>
                <div class="status-item">
                    <span class="status-label">AP Password:</span>
                    <span class="status-value">12345678</span>
                </div>
                <div class="status-item">
                    <span class="status-label">AP IP:</span>
                    <span class="status-value">192.168.4.1</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Status:</span>
                    <span class="status-value">✓ Connected</span>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let startTime = Date.now();

        function updateUptime() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            document.getElementById('uptime').textContent =
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function switchScreen(screen) {
            try {
                const response = await fetch('/screen?n=' + screen);
                if (response.ok) {
                    document.getElementById('screen').textContent = screen;
                    showToast('Screen ' + screen + ' activated');
                } else {
                    showToast('Error switching screen');
                }
            } catch (error) {
                showToast('Connection failed');
                console.error('Error:', error);
            }
        }

        async function nextScreen() {
            try {
                const response = await fetch('/next');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('screen').textContent = data.screen;
                    showToast('Screen ' + data.screen + '/3');
                } else {
                    showToast('Error');
                }
            } catch (error) {
                showToast('Connection failed');
                console.error('Error:', error);
            }
        }

        // Update uptime every second
        setInterval(updateUptime, 1000);
        updateUptime();

        // Check device status on load
        window.addEventListener('load', () => {
            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('screen').textContent = data.screen;
                })
                .catch(e => console.log('Status fetch failed:', e));
        });
    </script>
</body>
</html>
