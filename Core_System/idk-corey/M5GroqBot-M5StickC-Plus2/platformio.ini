[platformio]
default_envs = m5stickc_plus2

[env:m5stickc_plus2]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
lib_extra_dirs = ../_libs
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    tzapu/WiFiManager@^2.0.17
    links2004/WebSockets@^2.4.1
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_ENABLE_PROGMEM=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_ignore = 
    DFRobot_GP8XXX
