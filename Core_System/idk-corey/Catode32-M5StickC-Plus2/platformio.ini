[platformio]
default_envs = m5stickc_plus2

[env:m5stickc_plus2]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
lib_extra_dirs = ../_libs
monitor_speed = 115200
upload_speed = 921600
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0

lib_deps =
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -I src

build_unflags =
    -std=gnu++11
