[platformio]
default_envs = m5stickc_plus2

; PlatformIO Project Configuration File for Hector M5StickC Plus2
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stickc_plus2]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
lib_extra_dirs = ../_libs
# Serial communication settings
monitor_speed = 115200
upload_speed = 460800
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0

# Essential libraries for M5StickC Plus2
lib_deps =
# Build optimizations
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSERIAL_BUFFER_SIZE=256

# Library filtering
lib_ldf_mode = chain+
lib_ignore = DFRobot_GP8XXX

# Flash settings optimized for M5StickC Plus2
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
	
