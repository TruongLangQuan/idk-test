[platformio]
default_envs = m5stickc_plus2

[env:m5stickc_plus2]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200

lib_deps =
  m5stack/M5Unified @ ^0.2.13

lib_extra_dirs =
  ../shared

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=0

board_build.partitions = huge_app.csv
