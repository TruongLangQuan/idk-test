[env:waveshare-esp32-s3-147]
board = waveshare-esp32-s3-147
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-esp32-s3-147>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-esp32-s3-147
	-Os
	-DCORE_DEBUG_LEVEL=5
	-DBOARD_HAS_PSRAM
	-DUSE_SD_MMC
	-DDEVICE_NAME='"Waveshare S3"'
	-DUSB_as_HID=1

lib_deps =
	${env.lib_deps}
