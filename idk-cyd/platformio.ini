[env:cyd-esp32-2432s028r]
platform = espressif32@latest
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
	TFT_eSPI
	AsyncTCP
	ESPAsyncWebServer
	arduino-libraries/WiFi101@>=0.16.1

build_flags =
	-DUSER_SETUP_LOADED
	-DILI9341_DRIVER
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=240
	-DTFT_CS=15
	-DTFT_DC=32
	-DTFT_MOSI=13
	-DTFT_MISO=12
	-DTFT_SCLK=14
	-DTFT_RST=27
	-DTOUCH_CS=4
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8

monitor_filters = esp32_exception_decoder

[tool:piodebugging]
monitor_rts = 0
monitor_dtr = 0
